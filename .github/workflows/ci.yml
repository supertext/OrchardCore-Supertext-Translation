name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Build module and demo
        run: |
          dotnet build src/Supertext.OrchardCore.Translation/Supertext.OrchardCore.Translation.csproj -c Release
          dotnet build demo/SupertextDemo/SupertextDemo.csproj -c Release
      - name: Unit tests
        run: dotnet test tests/Supertext.OrchardCore.Translation.Tests -c Release
      - name: Pack
        run: dotnet pack src/Supertext.OrchardCore.Translation -c Release -o packages
      - name: Demo entrypoint and scripts syntax
        run: |
          sh -n demo/entrypoint.sh
          node --check Tests/Docs/stand-in.mjs
          node --check Tests/Docs/screenshots.mjs
          node --check Tests/E2E/features.mjs
          node --check Tests/E2E/live.mjs
